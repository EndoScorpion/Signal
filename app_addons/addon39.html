<style>#slcTb{position:fixed;top:30px;left:4px;max-width:340px;display:flex;flex-wrap:wrap;gap:4px;z-index:2147483300;background:#000c;border:1px solid #39ff14;border-radius:6px;padding:3px}
#slcTb button{position:static!important;margin:0!important;right:auto!important;top:auto!important}</style>
<script>
(function(){
/* build 039: one visible toolbar for the buttons added this session (they used to sit under the top banner) */
var IDS=["slcDivHx","slcRobBtn","slcGrabBtn","slcUp"];
function go(){var tb=document.getElementById("slcTb");if(!tb){tb=document.createElement("div");tb.id="slcTb";document.body.appendChild(tb)}
 IDS.forEach(function(id){var b=document.getElementById(id);if(b&&b.parentNode!==tb){if(id==="slcUp"){b.style.cssText+=";position:static!important"}tb.appendChild(b)}});
 var ban=document.getElementById("verBanner");if(ban){var r=ban.getBoundingClientRect();tb.style.top=Math.round(r.bottom+3)+"px"}}
setInterval(go,800);go();window.slcToolbar={go:go};
})();
</script>
