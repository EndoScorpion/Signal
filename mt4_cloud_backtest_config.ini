;+------------------------------------------------------------------+
;| MT4 Cloud Backtest Configuration for Neoclone Batch Suite       |
;| Symbol: EURUSD, Timeframe: M15 (primary test)                   |
;| Period: 2015-W23 HURRICANE (2015-06-01 to 2015-06-07)           |
;| Commission Model: FXOpen ECN sim tier (2.5 pts RT per trade)     |
;| 11 Nov 2026                                                      |
;+------------------------------------------------------------------+

Symbol=EURUSD
Period=15
FromDate=2015.06.01
ToDate=2015.06.07
Model=EveryTick
Optimization=FALSE
UseDate=TRUE
Visual=FALSE
Report=FALSE

; Account Configuration
Balance=5000        ; Sim tier $1k-$25k
Leverage=500
Spread=15           ; ECN variable (15 pts avg during session)
Commission=2.5      ; Per round-trip trade (0.01 lot = $2.50 commission)
CommissionMode=1    ; Fixed per round-trip

; Slippage & Execution
Slippage=2          ; 2 pts ECN slippage model
ExecutionMode=2     ; Instant (market)

; Lots & Risk
Lot=0.01
MaxPositions=2      ; Main position + hedge order

; Speed & Output
ShowReport=1
TesterOptimumStop=FALSE
